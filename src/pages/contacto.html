<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto – FinanciaPro Pagos</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav class="container">
      <a href="index.html" class="logo">FinanciaPro</a>
      <div class="hamburger" id="btn-menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </div>
      <div class="nav-links" id="menu-mobile">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="servicios.html">Servicios</a></li>
          <li><a href="tarifas.html">Tarifas</a></li>
          <li><a href="casos-exito.html">Casos de Éxito</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container py-6">
    <h2 class="text-center mb-4">Contáctanos</h2>

    <div class="grid-2">
      <div id="general">
        <h3 class="mt-2">Contacto General</h3>
        <form id="form-general" action="/api/contacto" method="POST" class="grid-2">
          <input type="hidden" name="tipo" value="general">
          <div>
            <label for="nombre-general">Nombre:</label>
            <input id="nombre-general" name="nombre" type="text" class="input" required>
          </div>
          <div>
            <label for="email-general">Email:</label>
            <input id="email-general" name="email" type="email" class="input" required>
          </div>
          <div>
            <label for="telefono-general">Teléfono:</label>
            <input id="telefono-general" name="telefono" type="tel" class="input">
          </div>
          <div>
            <label for="mensaje-general">Mensaje:</label>
            <textarea id="mensaje-general" name="mensaje" rows="4" class="input" required></textarea>
          </div>
          <button type="submit" class="btn">Enviar</button>
        </form>
      </div>

      <div id="soporte">
        <h3 class="mt-2">Soporte Técnico</h3>
        <form id="form-soporte" action="/api/soporte" method="POST" enctype="multipart/form-data" class="grid-2">
          <input type="hidden" name="tipo" value="soporte">
          <div>
            <label for="nombre-soporte">Nombre:</label>
            <input id="nombre-soporte" name="nombre" type="text" class="input" required>
          </div>
          <div>
            <label for="email-soporte">Email:</label>
            <input id="email-soporte" name="email" type="email" class="input" required>
          </div>
          <div>
            <label for="telefono-soporte">Teléfono:</label>
            <input id="telefono-soporte" name="telefono" type="tel" class="input">
          </div>
          <div>
            <label for="idcliente-soporte">ID de Cliente:</label>
            <input id="idcliente-soporte" name="idCliente" type="text" class="input" required>
          </div>
          <div>
            <label for="mensaje-soporte">Descripción del problema:</label>
            <textarea id="mensaje-soporte" name="mensaje" rows="4" class="input" required></textarea>
          </div>
          <div>
            <label for="archivo-soporte">Adjuntar archivo (opcional):</label>
            <input id="archivo-soporte" name="archivo" type="file" class="input">
          </div>
          <button type="submit" class="btn">Enviar solicitud</button>
        </form>
      </div>

      <div id="demo" class="grid-2">
        <h3 class="mt-2">Solicitar Demo</h3>
        <form id="form-demo" action="/api/demo" method="POST" class="grid-2">
          <input type="hidden" name="tipo" value="demo">
          <div>
            <label for="nombre-demo">Nombre:</label>
            <input id="nombre-demo" name="nombre" type="text" class="input" required>
          </div>
          <div>
            <label for="email-demo">Email:</label>
            <input id="email-demo" name="email" type="email" class="input" required>
          </div>
          <div>
            <label for="telefono-demo">Teléfono:</label>
            <input id="telefono-demo" name="telefono" type="tel" class="input">
          </div>
          <div>
            <label for="negocio-demo">Tipo de negocio:</label>
            <input id="negocio-demo" name="tipoNegocio" type="text" class="input" required>
          </div>
          <div>
            <label for="volumen-demo">Volumen aproximado de transacciones mensuales:</label>
            <input id="volumen-demo" name="volumen" type="number" class="input" required>
          </div>
          <div>
            <label for="mensaje-demo">Comentarios adicionales:</label>
            <textarea id="mensaje-demo" name="mensaje" rows="4" class="input"></textarea>
          </div>
          <button type="submit" class="btn">Enviar solicitud de demo</button>
        </form>
      </div>
    </div>

    <section class="mt-4">
      <h3>Nuestra Oficina</h3>
      <div style="width:100%;height:250px;">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." width="100%" height="100%" style="border:0;" loading="lazy"></iframe>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-container">
      <div>&copy; 2025 FinanciaPro Pagos</div>
      <div>
        <a href="#">Política de Privacidad</a> |
        <a href="#">Términos y Condiciones</a>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('btn-menu').addEventListener('click', () => {
      const menu = document.getElementById('menu-mobile');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
      menu.style.flexDirection = 'column';
    });
  </script>
</body>
</html>
