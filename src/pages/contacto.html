<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto – FinanciaPro Pagos</title>
  <meta name="description" content="Contáctanos para consultas generales, soporte técnico o solicitar una demo de FinanciaPro Pagos." />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="flex flex-col min-h-screen">
  <!-- Navbar -->
  <!-- Copiar navbar.html -->

  <main class="container mx-auto px-4 py-16">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-8">Contáctanos</h2>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Formulario de Contacto General -->
      <div id="general" class="border rounded-lg shadow p-6">
        <h3 class="text-2xl font-semibold mb-4">Contacto General</h3>
        <form id="form-general" action="/api/contacto" method="POST" class="space-y-4">
          <input type="hidden" name="tipo" value="general">
          <div>
            <label for="nombre-general" class="block text-gray-700">Nombre:</label>
            <input id="nombre-general" name="nombre" type="text" class="input" required>
          </div>
          <div>
            <label for="email-general" class="block text-gray-700">Email:</label>
            <input id="email-general" name="email" type="email" class="input" required>
          </div>
          <div>
            <label for="telefono-general" class="block text-gray-700">Teléfono:</label>
            <input id="telefono-general" name="telefono" type="tel" class="input">
          </div>
          <div>
            <label for="mensaje-general" class="block text-gray-700">Mensaje:</label>
            <textarea id="mensaje-general" name="mensaje" rows="4" class="input" required></textarea>
          </div>
          <button type="submit" class="btn">Enviar</button>
        </form>
      </div>

      <!-- Formulario de Soporte Técnico -->
      <div id="soporte" class="border rounded-lg shadow p-6">
        <h3 class="text-2xl font-semibold mb-4">Soporte Técnico</h3>
        <form id="form-soporte" action="/api/soporte" method="POST" enctype="multipart/form-data" class="space-y-4">
          <input type="hidden" name="tipo" value="soporte">
          <div>
            <label for="nombre-soporte" class="block text-gray-700">Nombre:</label>
            <input id="nombre-soporte" name="nombre" type="text" class="input" required>
          </div>
          <div>
            <label for="email-soporte" class="block text-gray-700">Email:</label>
            <input id="email-soporte" name="email" type="email" class="input" required>
          </div>
          <div>
            <label for="telefono-soporte" class="block text-gray-700">Teléfono:</label>
            <input id="telefono-soporte" name="telefono" type="tel" class="input">
          </div>
          <div>
            <label for="idcliente-soporte" class="block text-gray-700">ID de Cliente:</label>
            <input id="idcliente-soporte" name="idCliente" type="text" class="input" required>
          </div>
          <div>
            <label for="mensaje-soporte" class="block text-gray-700">Descripción del problema:</label>
            <textarea id="mensaje-soporte" name="mensaje" rows="4" class="input" required></textarea>
          </div>
          <div>
            <label for="archivo-soporte" class="block text-gray-700">Adjuntar archivo (opcional):</label>
            <input id="archivo-soporte" name="archivo" type="file" class="block w-full">
          </div>
          <button type="submit" class="btn">Enviar solicitud</button>
        </form>
      </div>

      <!-- Formulario de Solicitar Demo -->
      <div id="demo" class="border rounded-lg shadow p-6 lg:col-span-2">
        <h3 class="text-2xl font-semibold mb-4">Solicitar Demo</h3>
        <form id="form-demo" action="/api/demo" method="POST" class="space-y-4">
          <input type="hidden" name="tipo" value="demo">
          <div>
            <label for="nombre-demo" class="block text-gray-700">Nombre:</label>
            <input id="nombre-demo" name="nombre" type="text" class="input" required>
          </div>
          <div>
            <label for="email-demo" class="block text-gray-700">Email:</label>
            <input id="email-demo" name="email" type="email" class="input" required>
          </div>
          <div>
            <label for="telefono-demo" class="block text-gray-700">Teléfono:</label>
            <input id="telefono-demo" name="telefono" type="tel" class="input">
          </div>
          <div>
            <label for="negocio-demo" class="block text-gray-700">Tipo de negocio:</label>
            <input id="negocio-demo" name="tipoNegocio" type="text" class="input" required>
          </div>
          <div>
            <label for="volumen-demo" class="block text-gray-700">Volumen aproximado de transacciones mensuales:</label>
            <input id="volumen-demo" name="volumen" type="number" class="input" required>
          </div>
          <div>
            <label for="mensaje-demo" class="block text-gray-700">Comentarios adicionales:</label>
            <textarea id="mensaje-demo" name="mensaje" rows="4" class="input"></textarea>
          </div>
          <button type="submit" class="btn">Enviar solicitud de demo</button>
        </form>
      </div>
    </div>

    <!-- Mapa embebido -->
    <section class="mt-12">
      <h3 class="text-2xl font-semibold text-gray-800 mb-4">Nuestra Oficina</h3>
      <div class="w-full h-64 rounded overflow-hidden">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <!-- Copiar footer.html -->

  <script src="/js/main.js"></script>
</body>
</html>
